<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a1036">
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="format-detection" content="telephone=no">
  <title>AESA Prep · Entry &amp; exit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">

    <!-- ============ CARGANDO ============ -->
    <section id="p-cargando" class="pantalla oscura">
      <img class="escudo escudo-grande" src="logo.png" alt="AESA Prep Academy">
      <div class="marca">AESA Prep Academy</div>
      <div class="spinner" aria-hidden="true"></div>
      <p id="cargando-texto" class="cargando-texto" data-t="comprobando">Checking…</p>
    </section>

    <!-- ============ VINCULAR EL MÓVIL ============ -->
    <section id="p-vincular" class="pantalla oscura" hidden>
      <div class="tarjeta">
        <img class="escudo escudo-tarjeta" src="logo.png" alt="">
        <div class="marca marca-oscura">AESA Prep Academy</div>
        <h1 data-t="vincTitulo">Vincula tu móvil</h1>
        <p class="intro" data-t="vincIntro">Solo la primera vez. Te enviaremos un código a tu correo del centro.</p>
        <p id="vinc-aviso" class="aviso" hidden></p>

        <form id="f-email" novalidate>
          <label for="email" data-t="emailEtiqueta">Tu correo del centro</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required>
          <button id="b-enviar" type="submit" class="btn" data-t="enviarCodigo">Enviarme el código</button>
        </form>

        <form id="f-codigo" novalidate hidden>
          <p id="codigo-enviado" class="intro"></p>
          <label for="codigo" data-t="codigoEtiqueta">Código de 6 cifras</label>
          <input id="codigo" name="codigo" class="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" required>
          <button id="b-validar" type="submit" class="btn" data-t="validar">Vincular este móvil</button>
          <button id="b-otro-email" type="button" class="enlace" data-t="otroEmail">Usar otro correo / pedir otro código</button>
        </form>

        <p id="vinc-error" class="error" role="alert" hidden></p>
        <p class="nota" data-t="vincNota">Nunca te pediremos la contraseña de tu correo.</p>
      </div>
    </section>

    <!-- ============ RESULTADO (verde / rojo) ============ -->
    <section id="p-resultado" class="pantalla resultado" hidden aria-live="assertive">
      <div class="rayas" aria-hidden="true"></div>
      <img class="escudo escudo-mini" src="logo.png" alt="AESA Prep Academy">
      <div class="res">
        <div id="res-icono" class="res-icono" aria-hidden="true"></div>
        <h1 id="res-titulo" class="res-titulo"></h1>
        <p id="res-mensaje" class="res-mensaje"></p>
        <p id="res-chip" class="chip" hidden></p>
        <div class="foto-marco">
          <div class="anillo" aria-hidden="true"></div>
          <img id="res-foto" alt="" hidden>
          <span id="res-iniciales" class="iniciales"></span>
        </div>
        <div id="res-nombre" class="res-nombre"></div>
        <div id="res-curso" class="res-curso"></div>
        <div class="reloj-fila">
          <span class="punto-vivo" aria-hidden="true"></span>
          <span id="res-reloj" class="reloj">--:--:--</span>
        </div>
        <div id="res-fecha" class="res-fecha"></div>
        <div id="res-meta" class="res-meta"></div>
        <p id="res-repetido" class="res-repetido" hidden></p>
        <div class="barra" aria-hidden="true"><div id="res-barra"></div></div>
      </div>
    </section>

    <!-- ============ ERRORES / AVISOS ============ -->
    <section id="p-error" class="pantalla oscura" hidden>
      <img class="escudo escudo-mini" src="logo.png" alt="AESA Prep Academy">
      <div class="res-icono icono-aviso" aria-hidden="true">!</div>
      <h1 id="err-titulo" class="res-titulo"></h1>
      <p id="err-mensaje" class="res-mensaje"></p>
      <button id="b-reintentar" type="button" class="btn btn-claro" data-t="reintentar" hidden>Reintentar</button>
    </section>

  </main>

  <footer id="pie" class="pie">
    <button id="b-desvincular" type="button" class="enlace" data-t="noSoyYo" hidden>No soy yo / desvincular este móvil</button>
    <a href="privacidad.html" target="_blank" rel="noopener" data-t="privacidad">Aviso de privacidad</a>
    <span class="idiomas">
      <button type="button" class="enlace" data-idioma="es">ES</button> ·
      <button type="button" class="enlace" data-idioma="ca">CA</button> ·
      <button type="button" class="enlace" data-idioma="en">EN</button>
    </span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
